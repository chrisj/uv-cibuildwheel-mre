name: Windows uv build[uv] MRE

on:
  workflow_dispatch:

jobs:
  windows-build-uv-mre:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - uv_version: "0.11.7"
            outcome: fails
            continue_on_error: true
          - uv_version: "0.11.6"
            outcome: passes
            continue_on_error: false
    continue-on-error: ${{ matrix.continue_on_error }}
    steps:
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ matrix.uv_version }}
          enable-cache: false

      - name: Install uv-managed Python 3.13
        shell: pwsh
        run: |
          uv python install 3.13

      - name: Show runner and uv state
        shell: pwsh
        run: |
          Write-Host "expected=${{ matrix.outcome }}"
          Write-Host "runner.os=$env:RUNNER_OS"
          uv self version
          uv run python --version
          uv python list
          py -0p

      - name: Create minimal extension package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force mre_pkg | Out-Null
          @'
          [build-system]
          requires = ["setuptools>=64", "wheel"]
          build-backend = "setuptools.build_meta"

          [dependency-groups]
          cibuildwheel = ["cibuildwheel>=2.22.0"]
          '@ | Set-Content -Path mre_pkg/pyproject.toml
          @'
          from setuptools import Extension, setup

          setup(
            name="mre-pkg",
            version="0.0.1",
            python_requires=">=3.11",
            ext_modules=[Extension("mre_ext", ["mre_ext.c"])],
          )
          '@ | Set-Content -Path mre_pkg/setup.py
          @'
          #include <Python.h>

          static PyObject* hello(PyObject* self, PyObject* args) {
            return PyUnicode_FromString("hello");
          }

          static PyMethodDef methods[] = {
            {"hello", hello, METH_NOARGS, "Return a string."},
            {NULL, NULL, 0, NULL}
          };

          static struct PyModuleDef module = {
            PyModuleDef_HEAD_INIT,
            "mre_ext",
            NULL,
            -1,
            methods
          };

          PyMODINIT_FUNC PyInit_mre_ext(void) {
            return PyModule_Create(&module);
          }
          '@ | Set-Content -Path mre_pkg/mre_ext.c

      - name: Run cibuildwheel with build[uv]
        shell: pwsh
        env:
          CIBW_BUILD_FRONTEND: build[uv]
          CIBW_BUILD: cp312-win_amd64
          CIBW_DEBUG_TRACEBACK: "1"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_BEFORE_BUILD: python -c "import threading"
          UV_PYTHON: "3.13"
          UV_MANAGED_PYTHON: "1"
        run: |
          Push-Location mre_pkg
          uv run --only-group cibuildwheel cibuildwheel --output-dir ../dist .
          Pop-Location
