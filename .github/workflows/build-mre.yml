name: Windows uv build[uv] MRE

on:
  workflow_dispatch:

jobs:
  windows-build-uv-0117-mre:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
          enable-cache: false

      - name: Show runner and uv state
        shell: pwsh
        run: |
          Write-Host "runner.os=$env:RUNNER_OS"
          uv self version
          uv run python --version
          uv python list
          py -0p

      - name: Create minimal extension package and nox session
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force mre_pkg | Out-Null
          @'
          [build-system]
          requires = ["setuptools>=64", "wheel"]
          build-backend = "setuptools.build_meta"
          '@ | Set-Content -Path mre_pkg/pyproject.toml
          @'
          from setuptools import Extension, setup

          setup(
            name="mre-pkg",
            version="0.0.1",
            python_requires=">=3.11",
            ext_modules=[Extension("mre_ext", ["mre_ext.c"])],
          )
          '@ | Set-Content -Path mre_pkg/setup.py
          @'
          #include <Python.h>

          static PyObject* hello(PyObject* self, PyObject* args) {
            return PyUnicode_FromString("hello");
          }

          static PyMethodDef methods[] = {
            {"hello", hello, METH_NOARGS, "Return a string."},
            {NULL, NULL, 0, NULL}
          };

          static struct PyModuleDef module = {
            PyModuleDef_HEAD_INIT,
            "mre_ext",
            NULL,
            -1,
            methods
          };

          PyMODINIT_FUNC PyInit_mre_ext(void) {
            return PyModule_Create(&module);
          }
          '@ | Set-Content -Path mre_pkg/mre_ext.c
          @'
          import nox

          nox.options.error_on_external_run = True


          @nox.session(python=False)
          def cibuildwheel(session: nox.Session):
              session.run(
                  "uv",
                  "run",
                  "--with",
                  "cibuildwheel",
                  "cibuildwheel",
                  "--output-dir",
                  "dist",
                  "mre_pkg",
                  *session.posargs,
                  env={
                      "CIBW_BUILD_FRONTEND": "build[uv]",
                      "CIBW_BUILD": "cp311-win_amd64",
                      "CIBW_DEBUG_TRACEBACK": "1",
                      "CIBW_BUILD_VERBOSITY": "1",
                  },
              )
          '@ | Set-Content -Path noxfile.py

      - name: Reproduce build[uv] failure for cp311 on Windows via nox
        shell: pwsh
        run: |
          uvx nox -s cibuildwheel

  windows-build-uv-0116-mre:
    runs-on: windows-latest
    steps:
