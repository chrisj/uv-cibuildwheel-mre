name: Windows uv build[uv] MRE

on:
  workflow_dispatch:

jobs:
  windows-build-uv-mre:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - uv_version: "0.11.7"
            outcome: fails
            continue_on_error: true
          - uv_version: "0.11.6"
            outcome: passes
            continue_on_error: false
    continue-on-error: ${{ matrix.continue_on_error }}
    steps:
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ matrix.uv_version }}
          enable-cache: false

      - name: Install uv-managed Python 3.13
        shell: pwsh
        run: |
          uv python install 3.13

      - name: Show runner and uv state
        shell: pwsh
        run: |
          Write-Host "expected=${{ matrix.outcome }}"
          Write-Host "runner.os=$env:RUNNER_OS"
          uv self version
          uv run python --version
          uv python list
          py -0p

      - name: Create minimal package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force mre_pkg/src/mre_pkg | Out-Null
          @'
          [build-system]
          requires = ["setuptools>=64", "wheel"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "mre-pkg"
          version = "0.0.1"
          requires-python = ">=3.11"
          '@ | Set-Content -Path mre_pkg/pyproject.toml
          @'
          __all__ = ["hello"]

          def hello() -> str:
              return "hello"
          '@ | Set-Content -Path mre_pkg/src/mre_pkg/__init__.py

      - name: Run cibuildwheel with build[uv]
        shell: pwsh
        env:
          CIBW_BUILD_FRONTEND: build[uv]
          CIBW_BUILD: cp312-win_amd64
          CIBW_DEBUG_TRACEBACK: "1"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_BEFORE_BUILD: python -c "import threading"
        run: |
          Push-Location mre_pkg
          uv run cibuildwheel --output-dir ../dist .
          Pop-Location
